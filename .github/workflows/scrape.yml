name: Scrape Promos Diariamente

on:
  schedule:
    - cron: '0 12 * * *'  # Todos los días a las 12:00 UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Scrape promos
        run: npm run scrape

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/promos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update promos - $(date -u +'%Y-%m-%d %H:%M:%S')" && git push)
